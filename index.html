<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Downloader</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#111;
  color:white;
  text-align:center;
}
.header{
  padding:25px 10px;
  background:#1b1b1b;
}
.header h1{margin:0 0 18px;}
.platforms{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
}
.platforms button{
  padding:10px 15px;
  border:0;
  border-radius:8px;
  background:#333;
  color:white;
}
.main{
  max-width:550px;
  margin:60px auto;
  padding:20px;
}
input{
  box-sizing:border-box;
  width:100%;
  padding:16px;
  border:0;
  border-radius:10px;
  font-size:16px;
}
.download{
  margin-top:15px;
  padding:15px 35px;
  border:0;
  border-radius:10px;
  background:#00c853;
  color:white;
  font-size:18px;
  font-weight:bold;
}
#status{margin-top:20px;}
video{
  width:100%;
  margin-top:20px;
  border-radius:10px;
  display:none;
}
</style>
</head>

<body>

<div class="header">
  <h1>🎬 Video Downloader</h1>

  <div class="platforms">
    <button onclick="selectSite('TikTok')">TikTok</button>
    <button onclick="selectSite('Facebook')">Facebook</button>
    <button onclick="selectSite('Instagram')">Instagram</button>
    <button onclick="selectSite('YouTube')">YouTube</button>
  </div>
</div>

<div class="main">
  <h2 id="selected">Select a platform</h2>

  <input
    id="url"
    type="url"
    placeholder="Paste video link here"
  >

  <button class="download" onclick="downloadVideo()">
    ⬇️ Download
  </button>

  <p id="status"></p>

  <video id="preview" controls></video>
</div>

<script>
let selectedSite = "";

function selectSite(site){
  selectedSite = site;
  document.getElementById("selected").innerText =
    "Download from " + site;
  document.getElementById("url").placeholder =
    "Paste " + site + " video link here";
}

function downloadVideo(){
  const url = document.getElementById("url").value.trim();
  const status = document.getElementById("status");
  const preview = document.getElementById("preview");

  if(!selectedSite){
    status.innerText = "Please select a platform first.";
    return;
  }

  if(!url){
    status.innerText = "Please paste a video link.";
    return;
  }

  status.innerText =
    "Trying to open the video...";

  preview.src = url;
  preview.style.display = "block";

  const link = document.createElement("a");
  link.href = url;
  link.download = "video.mp4";
  link.target = "_blank";

  document.body.appendChild(link);
  link.click();
  link.remove();
}
</script>

</body>
</html>
