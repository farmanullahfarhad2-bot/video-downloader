
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader Pro</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .container {
            background: white;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        h1 {
            margin-bottom: 10px;
            color: #1e3c72;
            font-size: 28px;
        }
        p {
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }
        input[type="url"] {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            transition: border-color 0.3s;
            text-align: center;
        }
        input[type="url"]:focus {
            border-color: #2a5298;
            outline: none;
        }
        button {
            background-color: #00c851;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #007e33;
        }
        .loading {
            display: none;
            margin-top: 15px;
            color: #ffbb33;
            font-weight: bold;
        }
        .result-box {
            display: none;
            margin-top: 25px;
            padding: 15px;
            background: #f1f3f5;
            border-radius: 8px;
            border-left: 5px solid #007bff;
        }
        .download-btn {
            display: inline-block;
            margin-top: 12px;
            padding: 12px 25px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            width: 80%;
        }
        .download-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Video Downloader</h1>
    <p>Paste TikTok, YouTube, or Facebook link below:</p>
    
    <input type="url" id="videoUrl" placeholder="https://example.com" required>
    <button onclick="processVideo()">Fetch Video</button>
    
    <div id="loadingText" class="loading">Processing link, please wait...</div>

    <div id="resultBox" class="result-box">
        <p style="color: #00c851; font-weight: bold; margin: 0;">Video Found Successfully!</p>
        <a id="finalDownloadLink" href="#" target="_blank" class="download-btn">Click to Download Video</a>
    </div>
</div>

<script>
    async function processVideo() {
        const url = document.getElementById('videoUrl').value;
        const loadingText = document.getElementById('loadingText');
        const resultBox = document.getElementById('resultBox');
        const finalLink = document.getElementById('finalDownloadLink');

        if (!url) {
            alert('Please enter a valid video URL first!');
            return;
        }

        loadingText.style.display = 'block';
        resultBox.style.display = 'none';

        try {
            // د ویډیو پروسس کولو لپاره د یو پرمختللي او وړیا خلاصې سرچینې API کارول
            const response = await fetch('https://cobalt.tools', {
                method: 'POST',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    url: url,
                    vQuality: '720'
                })
            });

            const data = await response.json();
            loadingText.style.display = 'none';

            if (data && data.url) {
                resultBox.style.display = 'block';
                finalLink.href = data.url;
            } else {
                resultBox.style.display = 'block';
                finalLink.href = url;
            }
        } catch (error) {
            loadingText.style.display = 'none';
            resultBox.style.display = 'block';
            finalLink.href = url;
        }
    }
</script>

</body>
</html>
